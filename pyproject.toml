[project]
name = "ecommercedeliveryrisk"
version = "0.1.0"
description = "This project aims to implement an end-to-end pipeline for delivery risk prediction using the Brazilian E-Commerce Olist dataset that is publicly available on Kaggle."
readme = "README.md"
authors = [
    { name = "Nikoletta", email = "nikolettanod@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kaggle>=2.2.4",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
]

[project.scripts]
ecommercedeliveryrisk = "ecommercedeliveryrisk.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E4",  # basic python errors and structural style problems
    "E7",
    "E9",
    "F",  # unused imports/undrfined var/similar correctness issues
    "I",  # import ordering
    "UP",  # outdated python syntax -> modernize
    "B",  # common bug-prone patterns
    "C4",  # unnecessary or inefficient collection construction
    "RET",  # confusing or unnecessary return statements
    "SIM",  # unnecessarily complicated expressions
    "PERF",  # straightforward performance mistakes
    "RUF",  # Ruff-specific correctness checks
]

[tool.pyright]
include = ["src", "main.py"]
pythonVersion = "3.12"
typeCheckingMode = "standard"